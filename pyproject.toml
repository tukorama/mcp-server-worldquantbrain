[project]
name = "mcp-server-worldquantbrain"
version = "0.2.2"
description = "MCP server and LangGraph tools for WorldQuant BRAIN alpha research. Unofficial, not affiliated with WorldQuant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Marcell Tukora" }]
keywords = [
    "worldquant",
    "worldquant-brain",
    "wqb",
    "mcp",
    "langgraph",
    "langchain",
    "quant",
    "alpha",
    "backtest",
    "fastexpr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.10",
    "mcp>=2.3,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "starlette>=0.48",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
langgraph = ["langchain>=1.4.6", "langchain-core>=1.0", "langgraph>=1.2"]

[project.scripts]
mcp-server-worldquantbrain = "mcp_server_worldquantbrain.cli:main"

[project.urls]
Homepage = "https://github.com/tukorama/mcp-server-worldquantbrain"
Repository = "https://github.com/tukorama/mcp-server-worldquantbrain"
Issues = "https://github.com/tukorama/mcp-server-worldquantbrain/issues"
Changelog = "https://github.com/tukorama/mcp-server-worldquantbrain/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "anyio>=4.9",
    "hypothesis>=6.130",
    "mcp[cli]>=2.3,<3",
    "pip-audit>=2.10",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "S",
    "ASYNC",
    "PT",
    "C90",
    "PIE",
    "PERF",
    "RET",
    "RSE",
    "TID",
    "PGH",
    "PLC",
    "PLE",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["PLC0415"]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = true
reportImplicitStringConcatenation = true
reportCallInDefaultInitializer = true
reportPropertyTypeMismatch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real BRAIN API (needs WQB_LIVE=1)"]
