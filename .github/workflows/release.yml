name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check that the tag matches the package and manifest versions
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          test "$(jq -r '[.version, .packages[].version] | unique | join(" ")' server.json)" = "${GITHUB_REF_NAME#v}"
      - run: uv build --no-sources
      - name: Check the registry ownership marker in the wheel
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -F "mcp-name: $(jq -r .name server.json)"
      - name: Smoke test the wheel
        run: uvx --from dist/*.whl mcp-server-worldquantbrain tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - run: uv publish

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /server.json
          sparse-checkout-cone-mode: false
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.9
          SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The registry checks the PyPI package once, without retrying, so wait until PyPI serves it.
      - name: Wait for PyPI to serve the release
        run: |
          package="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r '.packages[0].version' server.json)"
          for _ in $(seq 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/$package/$version/json" && exit 0
            sleep 10
          done
          exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
